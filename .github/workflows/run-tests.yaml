name: C/C++ CI

on:
  push:
      branches: [ master, develop ]
  pull_request:
      branches: [ master, develop ]

jobs:
  build-and-test:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v2
      
      - name: install cpp-libs
      run: sudo apt install -y gfortran liblapack-dev libblas-dev python3.9
      
      - name: configure
      run: ./configure
      
      - name: make
      run: make -j cuda=0
      
      - name: run_test
      run: cd test && ./run_travis_test.py
